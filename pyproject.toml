[project]
name = "ai-psychologist-backend"
version = "0.1.0"
description = "Backend API for a self-discovery and daily reflection application"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "alembic>=1.16.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "email-validator>=2.0.0",
    "fastapi>=0.162.0",
    "itsdangerous>=2.2.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.8",
    "sqladmin>=0.32.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: unit tests",
    "integration: integration tests",
]

[tool.mypy]
exclude = ["^alembic/"]